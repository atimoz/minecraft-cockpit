name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:  # bouton "Run workflow" manuel sur la page Actions

permissions:
  contents: write     # nécessaire pour créer la release et y uploader les assets

jobs:
  build:
    name: Build & release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri app (NSIS installer)
        run: npm run tauri:build
        env:
          # Empêche tauri de râler s'il n'y a pas de signing key
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-cockpit-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Si le commit est un tag vX.Y.Z → crée une release GitHub avec l'installeur attaché
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true

      # Pour les push réguliers sur main → release "latest" mise à jour à chaque build
      - name: Update "latest" prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière build (main)
          body: |
            Build automatique du dernier commit `main`.

            **Pour installer** : télécharge le `.exe` ci-dessous, double-clique, suis l'installeur. Un raccourci se pose sur le bureau, double-clic pour lancer.

            Si Windows SmartScreen râle : *Informations complémentaires → Exécuter quand même* (app non signée).
          files: src-tauri/target/release/bundle/nsis/*.exe
          prerelease: true
          make_latest: false
